services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: agendai
      POSTGRES_USER: ${DB_USER:-agendai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-agendai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/agendai
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY in .env}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET in .env}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      DB_USER: ${DB_USER:-agendai}
      DB_PASSWORD: ${DB_PASSWORD:-agendai}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      LLM_PROVIDER: ${LLM_PROVIDER:-yandexgpt}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_FOLDER_ID: ${LLM_FOLDER_ID:-}
      LLM_MODEL: ${LLM_MODEL:-yandexgpt/latest}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://llm.api.cloud.yandex.net}
      LLM_TIMEOUT_SEC: ${LLM_TIMEOUT_SEC:-15}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1000}
      PUSH_PUBLIC_KEY: ${PUSH_PUBLIC_KEY:-}
      PUSH_PRIVATE_KEY: ${PUSH_PRIVATE_KEY:-}
      PUSH_SUBJECT: ${PUSH_SUBJECT:-mailto:admin@example.com}
      LOGGING_LEVEL_COM_EXAMPLE_AGEND_AI: ${LOG_LEVEL:-INFO}
      STT_PROVIDER: ${STT_PROVIDER:-}
      STT_API_KEY: ${STT_API_KEY:-}
      TTS_PROVIDER: ${TTS_PROVIDER:-speechkit}
      TTS_API_KEY: ${TTS_API_KEY:-}
      TTS_BASE_URL: ${TTS_BASE_URL:-https://tts.api.cloud.yandex.net}
      TTS_TIMEOUT_SEC: ${TTS_TIMEOUT_SEC:-12}
      TTS_VOICE: ${TTS_VOICE:-jane}
      TTS_EMOTION: ${TTS_EMOTION:-}
      TTS_SPEED: ${TTS_SPEED:-1.0}
      TTS_MAX_CHARS: ${TTS_MAX_CHARS:-400}
      GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID:-}
      GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CALENDAR_CLIENT_SECRET:-}
      GOOGLE_CALENDAR_REDIRECT_URI: ${GOOGLE_CALENDAR_REDIRECT_URI:-http://localhost:5173/api/calendar/google/callback}
      GOOGLE_CALENDAR_FRONTEND_RETURN_URL: ${GOOGLE_CALENDAR_FRONTEND_RETURN_URL:-http://localhost:5173/}
      GOOGLE_CALENDAR_WEBHOOK_BASE_URL: ${GOOGLE_CALENDAR_WEBHOOK_BASE_URL:-}
      GOOGLE_CALENDAR_POLL_DELAY_MS: ${GOOGLE_CALENDAR_POLL_DELAY_MS:-60000}
      GOOGLE_CALENDAR_OUTBOX_DELAY_MS: ${GOOGLE_CALENDAR_OUTBOX_DELAY_MS:-3000}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - app
    restart: unless-stopped


volumes:
  pgdata:

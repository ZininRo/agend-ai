spring:
  application:
    name: agend-ai
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agendai}
    username: ${DB_USER:agendai}
    password: ${DB_PASSWORD:agendai}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false

auth:
  jwt-secret: ${AUTH_JWT_SECRET:}
  issuer: ${AUTH_ISSUER:agend-ai}
  access-token-minutes: ${AUTH_ACCESS_TOKEN_MINUTES:15}
  refresh-token-days: ${AUTH_REFRESH_TOKEN_DAYS:30}
  refresh-reuse-grace-seconds: ${AUTH_REFRESH_REUSE_GRACE_SECONDS:10}
  cookie-secure: ${AUTH_COOKIE_SECURE:false}
  cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Strict}

app:
  timezone: Europe/Moscow
  context:
    max-messages: 10
  meeting:
    default-duration-min: 60
  pending:
    ttl-min: 30

# Распознавание речи — фаза 3 (ключи только из окружения/.env)
stt:
  provider: ${STT_PROVIDER:speechkit}
  api-key: ${STT_API_KEY:}
  base-url: ${STT_BASE_URL:https://stt.api.cloud.yandex.net}
  timeout-sec: ${STT_TIMEOUT_SEC:10}
  min-confidence: ${STT_MIN_CONFIDENCE:0.5}

# Синтез речи. Если TTS_API_KEY не задан, SpeechKit TTS использует STT_API_KEY.
tts:
  provider: ${TTS_PROVIDER:speechkit}
  api-key: ${TTS_API_KEY:}
  base-url: ${TTS_BASE_URL:https://tts.api.cloud.yandex.net}
  timeout-sec: ${TTS_TIMEOUT_SEC:12}
  voice: ${TTS_VOICE:jane}
  emotion: ${TTS_EMOTION:}
  speed: ${TTS_SPEED:1.0}
  max-chars: ${TTS_MAX_CHARS:400}

# YandexGPT. Ключ и каталог берутся из .env: LLM_API_KEY и LLM_FOLDER_ID.
llm:
  provider: ${LLM_PROVIDER:yandexgpt}
  model: ${LLM_MODEL:yandexgpt/latest}
  api-key: ${LLM_API_KEY:}
  base-url: ${LLM_BASE_URL:https://llm.api.cloud.yandex.net}
  folder-id: ${LLM_FOLDER_ID:}
  timeout-sec: ${LLM_TIMEOUT_SEC:15}
  max-tokens: ${LLM_MAX_TOKENS:1000}

limits:
  max-audio-sec: 30
  max-audio-bytes: 5242880
  max-text-chars: 1000
  rate:
    voice-per-min: ${VOICE_RATE_PER_MIN:10}
    message-per-min: ${MESSAGE_RATE_PER_MIN:30}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

debug:
  save-audio: false

# Web Push. Disabled until a VAPID keypair is configured.
push:
  public-key: ${PUSH_PUBLIC_KEY:}
  private-key: ${PUSH_PRIVATE_KEY:}
  subject: ${PUSH_SUBJECT:mailto:admin@example.com}
  scan-delay-ms: ${PUSH_SCAN_DELAY_MS:15000}
# Google Calendar OAuth + two-way synchronization (P4).
calendar:
  google:
    client-id: ${GOOGLE_CALENDAR_CLIENT_ID:}
    client-secret: ${GOOGLE_CALENDAR_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_CALENDAR_REDIRECT_URI:http://localhost:5173/api/calendar/google/callback}
    frontend-return-url: ${GOOGLE_CALENDAR_FRONTEND_RETURN_URL:http://localhost:5173/}
    authorization-url: ${GOOGLE_CALENDAR_AUTHORIZATION_URL:https://accounts.google.com/o/oauth2/v2/auth}
    token-url: ${GOOGLE_CALENDAR_TOKEN_URL:https://oauth2.googleapis.com/token}
    revoke-url: ${GOOGLE_CALENDAR_REVOKE_URL:https://oauth2.googleapis.com/revoke}
    api-base-url: ${GOOGLE_CALENDAR_API_BASE_URL:https://www.googleapis.com/calendar/v3}
    webhook-base-url: ${GOOGLE_CALENDAR_WEBHOOK_BASE_URL:}
    timeout-sec: ${GOOGLE_CALENDAR_TIMEOUT_SEC:10}
    oauth-state-minutes: ${GOOGLE_CALENDAR_OAUTH_STATE_MINUTES:10}
    poll-delay-ms: ${GOOGLE_CALENDAR_POLL_DELAY_MS:60000}
    outbox-delay-ms: ${GOOGLE_CALENDAR_OUTBOX_DELAY_MS:3000}
    initial-past-days: ${GOOGLE_CALENDAR_INITIAL_PAST_DAYS:90}
    initial-future-days: ${GOOGLE_CALENDAR_INITIAL_FUTURE_DAYS:365}
    full-sync-every-hours: ${GOOGLE_CALENDAR_FULL_SYNC_EVERY_HOURS:24}
    watch-ttl-seconds: ${GOOGLE_CALENDAR_WATCH_TTL_SECONDS:604800}
